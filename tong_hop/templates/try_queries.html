<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kết Quả Truy Vấn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container py-5">
    <h2 class="mb-4 text-primary fw-bold">Kết Quả Truy Vấn & Danh Sách Sinh Viên</h2>

    <!-- Khối 1: Hiển thị mảng kết quả lines -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white fw-bold">
        Kết Quả Truy Vấn Chi Tiết
      </div>
      <ul class="list-group list-group-flush">
        {% for line in lines %}
        <li class="list-group-item">{{ line }}</li>
        {% endfor %}
      </ul>
    </div>

    <!-- Khối 2: Bảng dữ liệu Sinh Viên -->
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white fw-bold">
        Bảng Dữ Liệu Sinh Viên (CSDL)
      </div>
      <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>MSSV</th>
              <th>Họ và Tên</th>
              <th>GPA</th>
            </tr>
          </thead>
          <tbody>
            {% for sv in everyone %}
            <tr>
              <td>{{ sv.id }}</td>
              <td><code>{{ sv.mssv }}</code></td>
              <td>{{ sv.name }}</td>
              <td>
                <span
                  class="badge {% if sv.gpa >= 8.0 %}bg-success{% elif sv.gpa >= 6.5 %}bg-primary{% else %}bg-secondary{% endif %}">
                  {{ sv.gpa }}
                </span>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>

</body>

</html>
