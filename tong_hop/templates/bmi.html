<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính Chỉ Số BMI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-4">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4 text-primary fw-bold">Tính Chỉ Số BMI</h3>
                    
                    <form method="POST" action="">
                        <!-- Ô nhập Chiều cao -->
                        <div class="mb-3">
                            <label for="height" class="form-label fw-semibold">Chiều cao (cm):</label>
                            <input type="text" 
                                   id="height" 
                                   name="height" 
                                   value="{{ height }}" 
                                   placeholder="Ví dụ: 170 hoặc 165,5" 
                                   class="form-control {% if errors.height %}is-invalid{% endif %}">
                            {% if errors.height %}
                                <div class="invalid-feedback">{{ errors.height }}</div>
                            {% endif %}
                        </div>

                        <!-- Ô nhập Cân nặng -->
                        <div class="mb-3">
                            <label for="weight" class="form-label fw-semibold">Cân nặng (kg):</label>
                            <input type="text" 
                                   id="weight" 
                                   name="weight" 
                                   value="{{ weight }}" 
                                   placeholder="Ví dụ: 65 hoặc 58,5" 
                                   class="form-control {% if errors.weight %}is-invalid{% endif %}">
                            {% if errors.weight %}
                                <div class="invalid-feedback">{{ errors.weight }}</div>
                            {% endif %}
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3">Tính BMI</button>
                    </form>

                    <!-- Hiển thị kết quả -->
                    {% if result %}
                        <div class="alert alert-{{ result.color_class }} text-center mt-4 mb-0 rounded-3" role="alert">
                            <div class="fs-6 text-uppercase fw-semibold text-secondary">Chỉ số BMI của bạn</div>
                            <div class="display-5 fw-bold my-1">{{ result.bmi }}</div>
                            <div class="fs-4 fw-bold mb-2">{{ result.category }}</div>
                            <hr class="my-2">
                            <div class="small fw-semibold">
                                Cân nặng nên có: <span class="badge bg-dark fs-6">{{ result.min_weight }} kg - {{ result.max_weight }} kg</span>
                            </div>
                        </div>
                    {% endif %}

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
