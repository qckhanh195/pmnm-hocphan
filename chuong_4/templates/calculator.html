<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Tính</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4 text-primary fw-bold">Máy Tính Đơn Giản</h3>
                    
                    <form method="POST" action="">
                        <!-- Ô nhập Số a -->
                        <div class="mb-3">
                            <label for="a" class="form-label fw-semibold">Số thứ nhất:</label>
                            <input type="text" 
                                   id="a" 
                                   name="a" 
                                   value="{{ a }}" 
                                   placeholder="Nhập số a ..." 
                                   class="form-control {% if errors.a %}is-invalid{% endif %}">
                            {% if errors.a %}
                                <div class="invalid-feedback">{{ errors.a }}</div>
                            {% endif %}
                        </div>

                        <!-- Ô chọn Phép toán op -->
                        <div class="mb-3">
                            <label for="op" class="form-label fw-semibold">Phép toán:</label>
                            <select id="op" name="op" class="form-select {% if errors.op %}is-invalid{% endif %}">
                                <option value="+" {% if op == '+' %}selected{% endif %}>+</option>
                                <option value="-" {% if op == '-' %}selected{% endif %}>-</option>
                                <option value="*" {% if op == '*' %}selected{% endif %}>*</option>
                                <option value="/" {% if op == '/' %}selected{% endif %}>/</option>
                            </select>
                            {% if errors.op %}
                                <div class="invalid-feedback">{{ errors.op }}</div>
                            {% endif %}
                        </div>

                        <!-- Ô nhập Số b -->
                        <div class="mb-3">
                            <label for="b" class="form-label fw-semibold">Số thứ hai:</label>
                            <input type="text" 
                                   id="b" 
                                   name="b" 
                                   value="{{ b }}" 
                                   placeholder="Nhập số b ..." 
                                   class="form-control {% if errors.b %}is-invalid{% endif %}">
                            {% if errors.b %}
                                <div class="invalid-feedback">{{ errors.b }}</div>
                            {% endif %}
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3">Tính toán</button>
                    </form>

                    <!-- Hiển thị kết quả -->
                    {% if result is not none %}
                        <div class="alert alert-success text-center mt-4 mb-0 fs-4 fw-bold" role="alert">
                            {{ result }}
                        </div>
                    {% endif %}

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
