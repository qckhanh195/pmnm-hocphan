<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính Điểm Học Phần</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-4">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4 text-primary fw-bold">Tính Điểm Học Phần</h3>
                    
                    <form method="POST" action="">
                        <!-- Điểm Chuyên Cần (10%) -->
                        <div class="mb-3">
                            <label for="cc" class="form-label fw-semibold">Điểm Chuyên cần (10%):</label>
                            <input type="text" 
                                   id="cc" 
                                   name="cc" 
                                   value="{{ cc }}" 
                                   placeholder="Nhập điểm chuyên cần ..." 
                                   class="form-control {% if errors.cc %}is-invalid{% endif %}">
                            {% if errors.cc %}
                                <div class="invalid-feedback">{{ errors.cc }}</div>
                            {% endif %}
                        </div>

                        <!-- Điểm Giữa Kỳ (30%) -->
                        <div class="mb-3">
                            <label for="gk" class="form-label fw-semibold">Điểm Giữa kỳ (30%):</label>
                            <input type="text" 
                                   id="gk" 
                                   name="gk" 
                                   value="{{ gk }}" 
                                   placeholder="Nhập điểm giữa kỳ ..." 
                                   class="form-control {% if errors.gk %}is-invalid{% endif %}">
                            {% if errors.gk %}
                                <div class="invalid-feedback">{{ errors.gk }}</div>
                            {% endif %}
                        </div>

                        <!-- Điểm Cuối Kỳ (60%) -->
                        <div class="mb-3">
                            <label for="ck" class="form-label fw-semibold">Điểm Cuối kỳ (60%):</label>
                            <input type="text" 
                                   id="ck" 
                                   name="ck" 
                                   value="{{ ck }}" 
                                   placeholder="Nhập điểm cuối kỳ ..." 
                                   class="form-control {% if errors.ck %}is-invalid{% endif %}">
                            {% if errors.ck %}
                                <div class="invalid-feedback">{{ errors.ck }}</div>
                            {% endif %}
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3">Tính điểm</button>
                    </form>

                    <!-- Hiển thị kết quả -->
                    {% if result %}
                        <div class="alert {% if result.grade == 'F' %}alert-danger{% else %}alert-success{% endif %} text-center mt-4 mb-0" role="alert">
                            <div class="fs-5 fw-normal">Điểm trung bình: <strong>{{ result.score }}</strong></div>
                            <div class="fs-2 fw-bold my-1">Điểm chữ: {{ result.grade }}</div>
                            <small class="d-block text-muted">{{ result.note }}</small>
                        </div>
                    {% endif %}

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
